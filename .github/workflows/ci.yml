name: Bedrock Network CI
on:
  push:
    branches: [main, "agent/**", "fix/**", "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Validate fully native minigame project
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate repository invariants
        run: python3 tests/validate_project.py
      - name: Validate plugin catalog
        run: python3 tests/validate_plugin_catalog.py
      - name: Validate public shell configuration
        shell: bash
        run: |
          set -euo pipefail
          source config/network.env
          source config/engines.env
          [[ -z "$PUBLIC_IP" ]]
          [[ -z "$PUBLIC_DOMAIN" ]]
          [[ -z "$PUBLIC_HOST" ]]
          [[ "$WEB_MAX_UPLOAD_MB" -ge 1024 ]]
          [[ "$SURVIVAL_ENGINE" == bds ]]
          [[ "$PVP_ENGINE" == pnx && "$BEDWARS_ENGINE" == pnx && "$SKYWARS_ENGINE" == pnx ]]
          [[ "$PNX_EXPECTED_MINECRAFT" == 26.40 ]]
      - name: Test BDS update resolver
        run: python3 tests/test_bds_resolver.py
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n mcserver
          bash -n install.sh
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find scripts -type f -name '*.sh' -print0)
      - name: Validate terminal UI without ANSI
        shell: bash
        run: |
          set -euo pipefail
          output="$(NO_COLOR=1 bash -c 'source scripts/ui.sh; ui_banner "CI"; ui_step "step"; ui_ok "ok"; ui_warn "warn"' 2>&1)"
          grep -q 'NEXORA · BEDROCK NETWORK' <<<"$output"
          grep -q '\[◆\] step' <<<"$output"
          grep -q '\[✓\] ok' <<<"$output"
          [[ "$output" != *$'\033'* ]]
      - name: Validate runtime permission recovery and fresh PNX prepare
        shell: bash
        run: |
          set -euo pipefail
          sudo groupadd -f bedrock
          id bedrock >/dev/null 2>&1 || sudo useradd --system --gid bedrock --no-create-home --shell /usr/sbin/nologin bedrock
          sudo rm -rf /tmp/perm-root /tmp/engine-root
          sudo mkdir -p /tmp/perm-root/app /tmp/perm-root/scripts
          sudo cp -a . /tmp/perm-root/app/
          sudo cp -a scripts/. /tmp/perm-root/scripts/
          sudo chmod 0700 /tmp/perm-root /tmp/perm-root/app /tmp/perm-root/app/scripts
          sudo find /tmp/perm-root/app/scripts -type f -name '*.sh' -exec chmod 0644 {} +
          sudo find /tmp/perm-root/scripts -type f -name '*.sh' -exec chmod 0644 {} +
          sudo BEDROCK_ROOT=/tmp/perm-root NO_COLOR=1 bash scripts/normalize-permissions.sh
          test -x /tmp/perm-root/app/scripts/minigame-manager.sh
          test -x /tmp/perm-root/app/scripts/update-project.sh
          test -x /tmp/perm-root/scripts/minigame-manager.sh
          [[ "$(stat -c %a /tmp/perm-root)" == 755 ]]
          [[ "$(stat -c %a /tmp/perm-root/app/scripts)" == 755 ]]
          sudo BEDROCK_ROOT=/tmp/engine-root NO_COLOR=1 bash scripts/engine-manager.sh prepare pvp
          test -f /tmp/engine-root/instances/pvp/pnx.yml
          sudo BEDROCK_ROOT=/tmp/engine-root NO_COLOR=1 bash scripts/engine-manager.sh prepare bedwars
          sudo BEDROCK_ROOT=/tmp/engine-root NO_COLOR=1 bash scripts/engine-manager.sh prepare skywars
      - name: Validate Survival ZIP and MCWORLD import detection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          root=Path('/tmp/world-src/MiMundo')
          (root/'db').mkdir(parents=True)
          (root/'level.dat').write_bytes(b'bedrock-test')
          (root/'db'/'000001.ldb').write_bytes(b'test')
          for output in ('/tmp/MiMundo.zip','/tmp/MiMundo.mcworld'):
              with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED) as z:
                  for p in root.rglob('*'):
                      if p.is_file(): z.write(p, Path('MiMundo')/p.relative_to(root))
          with zipfile.ZipFile('/tmp/unsafe.zip','w') as z:
              z.writestr('../evil','x')
          PY
          bash scripts/import-survival.sh --check /tmp/MiMundo.zip
          bash scripts/import-survival.sh --check /tmp/MiMundo.mcworld
          if bash scripts/import-survival.sh --check /tmp/unsafe.zip; then
            echo 'Unsafe archive was accepted' >&2
            exit 1
          fi
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do node --check "$source"; done < <(find addons web -type f -name '*.js' -print0)
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/bds-resolver.py web/server.py tests/validate_project.py tests/validate_plugin_catalog.py tests/test_bds_resolver.py tests/test_pnx_source_pin.py
      - name: Build native PvP plugin
        run: |
          mvn -q -f pnx-plugins/nexora-practice/pom.xml -DskipTests package
          test -f pnx-plugins/nexora-practice/target/nexora-practice-0.2.0.jar
      - name: Build native BedWars plugin
        run: |
          mvn -q -f pnx-plugins/nexora-bedwars/pom.xml -DskipTests package
          test -f pnx-plugins/nexora-bedwars/target/nexora-bedwars-0.1.0.jar
      - name: Build native SkyWars plugin
        run: |
          mvn -q -f pnx-plugins/nexora-skywars/pom.xml -DskipTests package
          test -f pnx-plugins/nexora-skywars/target/nexora-skywars-0.1.0.jar
      - name: Validate Survival achievement safety
        run: bash scripts/check-survival-safety.sh instances/survival/server.properties
      - name: Validate minigame and web safety gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'nexora-bedwars.jar' scripts/render-lobby-config.sh
          grep -q 'nexora-skywars.jar' scripts/render-lobby-config.sh
          grep -q 'NexoraBedWars' scripts/minigame-manager.sh
          grep -q 'NexoraSkyWars' scripts/minigame-manager.sh
          grep -q 'conflicts' config/plugins.json
          grep -q 'modeReady' addons/lobby_bp/scripts/main.js
          grep -q 'require_correct_dns' scripts/web-setup.sh
          grep -q 'secure_admin_request' web/server.py
          grep -q 'bedrock-survival-import.path' scripts/lib.sh
          grep -q 'survival-pending-import' scripts/network-manager.sh
          grep -q 'normalize-permissions.sh' scripts/update-project.sh
          grep -q 'exec bash.*update-project.sh' mcserver
          grep -q 'www.duckdns.org' scripts/first-install.sh
          grep -q 'ui_run_task' scripts/bootstrap-runtime.sh
          ! grep -q 'minecraftnexora.duckdns.org' README.md
          ! grep -q '163.192.204.78' config/network.env
      - name: Smoke test website and authenticated upload queue
        shell: bash
        run: |
          set -euo pipefail
          token='ci-admin-token'
          printf '%s' "$token" | sha256sum | awk '{print $1}' > config/web-admin.token.sha256
          rm -rf uploads state/web-imports
          BEDROCK_BASE="$PWD" WEB_HOST=127.0.0.1 WEB_PORT=18080 WEB_MAX_UPLOAD_MB=16 python3 web/server.py >/tmp/bedrock-web.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do curl -fsS http://127.0.0.1:18080/healthz >/dev/null && break; sleep .25; done
          curl -fsS http://127.0.0.1:18080/healthz | python3 -c 'import json,sys; assert json.load(sys.stdin)["ok"] is True'
          code="$(curl -sS -o /tmp/noauth.json -w '%{http_code}' http://127.0.0.1:18080/api/admin/check)"
          [[ "$code" == 401 ]]
          curl -fsS -H "X-Admin-Token: $token" http://127.0.0.1:18080/api/admin/check | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] is True and d["max_upload_mb"]==16'
          printf 'fake-zip-body' >/tmp/Survival.zip
          curl -fsS -X POST -H "X-Admin-Token: $token" -H 'X-Filename: Survival.zip' -H 'Content-Type: application/octet-stream' --data-binary @/tmp/Survival.zip http://127.0.0.1:18080/api/admin/survival/upload >/tmp/upload.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/upload.json'))
          assert d['ok'] is True and d['state']=='queued' and len(d['id'])==32
          assert (Path('uploads/requests')/(d['id']+'.json')).is_file()
          assert (Path('state/web-imports')/(d['id']+'.json')).is_file()
          PY

  bedwars-fallback-compatibility:
    name: Build pinned BedWars fallback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build SilentBedwars fallback against current PNX API
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/SilentWolf6662/SilentBedwars.git /tmp/bedwars
          git -C /tmp/bedwars checkout -q --detach e441c2f96619fcc20ee382ee2a44017cfcb3fd35
          chmod +x /tmp/bedwars/gradlew
          (cd /tmp/bedwars && ./gradlew --no-daemon --console=plain --init-script "$GITHUB_WORKSPACE/config/pnx-gradle.init.gradle" clean shadowJar)
          find /tmp/bedwars/build/libs -name 'SilentBedwars-*.jar' -type f | grep -q .

  skywars-fallback-compatibility:
    name: Build pinned SkyWars fallback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build PowerSkywars fallback against current PowerNukkitX API
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/VenityNetwork/PowerSkywars.git /tmp/skywars
          git -C /tmp/skywars checkout -q --detach 611466227c6a6435f527dc970d241f580dea090d
          chmod +x /tmp/skywars/gradlew
          (cd /tmp/skywars && ./gradlew --no-daemon --console=plain --init-script "$GITHUB_WORKSPACE/config/pnx-gradle.init.gradle" clean jar)
          find /tmp/skywars/build -maxdepth 1 -name '*.jar' -type f | grep -q .

  package:
    name: Package deployable project
    needs: [validate, bedwars-fallback-compatibility, skywars-fallback-compatibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create installation archive
        run: tar --exclude='.git' --exclude='target' --exclude='build' --exclude='__pycache__' --exclude='*.pyc' -czf bedrock-network.tar.gz README.md install.sh mcserver addons config docs instances pnx-plugins scripts systemd tests web
      - uses: actions/upload-artifact@v4
        with:
          name: bedrock-network
          path: bedrock-network.tar.gz
          if-no-files-found: error
          retention-days: 14
