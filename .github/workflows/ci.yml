name: Bedrock Network CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate project invariants
        run: python tests/validate_project.py

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            echo "Checking $source"
            node --check "$source"
          done < <(find addons -type f -name '*.js' -print0)

      - name: Validate Survival achievement safety
        run: bash scripts/check-survival-safety.sh instances/survival/server.properties

  package:
    name: Package deployable project
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create installation archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            -czf bedrock-network.tar.gz \
            README.md addons config docs instances scripts systemd tests

      - name: Upload installation artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-network
          path: bedrock-network.tar.gz
          if-no-files-found: error
          retention-days: 14
