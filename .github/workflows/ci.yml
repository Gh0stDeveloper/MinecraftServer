name: Bedrock Network CI
on:
  push:
    branches: [main, agent/hybrid-plugin-engines]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Validate hybrid project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate repository invariants
        run: python3 tests/validate_project.py
      - name: Validate plugin catalog
        run: python3 tests/validate_plugin_catalog.py
      - name: Validate shell-compatible configuration
        shell: bash
        run: |
          set -euo pipefail
          source config/network.env
          source config/engines.env
          [[ "$SERVER_NAME" == "Bedrock Network" ]]
          [[ "$SURVIVAL_ENGINE" == bds ]]
          [[ "$PVP_ENGINE" == pnx ]]
          [[ "$BEDWARS_ENGINE" == pnx ]]
          [[ "$SKYWARS_ENGINE" == pnx ]]
          [[ "$PNX_JAVA_MIN" -ge 21 ]]
      - name: Test BDS update resolver
        run: python3 tests/test_bds_resolver.py
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n mcserver
          bash -n install.sh
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find scripts -type f -name '*.sh' -print0)
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do node --check "$source"; done < <(find addons web -type f -name '*.js' -print0)
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/bds-resolver.py web/server.py tests/validate_project.py tests/validate_plugin_catalog.py tests/test_bds_resolver.py
      - name: Build internal PowerNukkitX plugin
        run: mvn -q -f pnx-plugins/nexora-practice/pom.xml -DskipTests package
      - name: Validate Survival achievement safety
        run: bash scripts/check-survival-safety.sh instances/survival/server.properties
      - name: Smoke test public website
        shell: bash
        run: |
          set -euo pipefail
          BEDROCK_BASE="$PWD" WEB_HOST=127.0.0.1 WEB_PORT=18080 python3 web/server.py >/tmp/bedrock-web.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do curl -fsS http://127.0.0.1:18080/healthz >/dev/null && break; sleep .25; done
          curl -fsS http://127.0.0.1:18080/healthz | python3 -c 'import json,sys; assert json.load(sys.stdin)["ok"] is True'
          curl -fsS http://127.0.0.1:18080/api/status | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["servers"])==5; e={x["id"]:x["engine"] for x in d["servers"]}; assert e=={"lobby":"bds","survival":"bds","pvp":"pnx","bedwars":"pnx","skywars":"pnx"}'
  plugin-compatibility:
    name: Build pinned third-party minigame plugins
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build SilentBedwars at pinned commit
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/SilentWolf6662/SilentBedwars.git /tmp/bedwars
          git -C /tmp/bedwars checkout -q --detach e441c2f96619fcc20ee382ee2a44017cfcb3fd35
          chmod +x /tmp/bedwars/gradlew
          (cd /tmp/bedwars && ./gradlew --no-daemon --console=plain clean shadowJar)
          find /tmp/bedwars/build/libs -name 'SilentBedwars-*.jar' -type f | grep -q .
      - name: Build PowerSkywars at pinned commit
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/VenityNetwork/PowerSkywars.git /tmp/skywars
          git -C /tmp/skywars checkout -q --detach 611466227c6a6435f527dc970d241f580dea090d
          chmod +x /tmp/skywars/gradlew
          (cd /tmp/skywars && ./gradlew --no-daemon --console=plain clean jar)
          find /tmp/skywars/build/libs -name '*.jar' -type f | grep -q .
  package:
    name: Package deployable project
    needs: [validate, plugin-compatibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create installation archive
        run: |
          tar --exclude='.git' --exclude='target' --exclude='build' --exclude='__pycache__' --exclude='*.pyc' -czf bedrock-network.tar.gz README.md install.sh mcserver addons config docs instances pnx-plugins scripts systemd tests web
      - uses: actions/upload-artifact@v4
        with:
          name: bedrock-network
          path: bedrock-network.tar.gz
          if-no-files-found: error
          retention-days: 14
